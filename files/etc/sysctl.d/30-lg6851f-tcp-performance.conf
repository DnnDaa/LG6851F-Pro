# Local TCP sockets (router services and TCP proxy endpoints), not client TCP.
#32MiB autotuning ceilings cover about100ms BDP at2.5Gbps for local sockets.
# These are on-demand limits;
# tcp_mem remains kernel-managed and no large per-connection default is added.
net.core.rmem_max=33554432
net.core.wmem_max=33554432
net.ipv4.tcp_rmem=4096 131072 33554432
net.ipv4.tcp_wmem=4096 65536 33554432
net.ipv4.tcp_fastopen=3
# Bound local queued data without reducing the receive window or bytes in flight.
# 1MiB is deliberately conservative for the existing2.5Gbps offload path.
net.ipv4.tcp_limit_output_bytes=1048576
net.ipv4.tcp_notsent_lowat=1048576
# Recover from PMTU black holes only when detected; preserve normal discovery.
net.ipv4.tcp_mtu_probing=1
